services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: basaer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basaer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basaer_password}
      POSTGRES_DB: ${POSTGRES_DB:-basaer}
    ports:
      - "127.0.0.1:5432:5432" # Bind only to localhost for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-basaer} -d ${POSTGRES_DB:-basaer}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - basaer-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 256M

  # Redis for Queues
  redis:
    image: redis:7-alpine
    container_name: basaer-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-strong_redis_password} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # Bind only to localhost for security
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-strong_redis_password}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - basaer-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: basaer-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-basaer}:${POSTGRES_PASSWORD:-basaer_password}@postgres:5432/${POSTGRES_DB:-basaer}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?BOOTSTRAP_SECRET is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?SEED_DEFAULT_PASSWORD is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-https://basaerschools.com.ng}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://basaerschools.com.ng}
      # Limits to prevent memory spikes in Docker
      NODE_OPTIONS: "--max-old-space-size=4096"
    ports:
      - "127.0.0.1:3001:3001" # Bind to localhost, expose via Nginx
    volumes:
      - storage_uploads:/app/public/uploads
      - storage_exports:/app/public/exports
      - storage_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "require('http').get('http://localhost:3001/health', r => { if (r.statusCode !== 200) process.exit(1); r.resume(); }).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basaer-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.25"

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://basaerschools.com.ng/api}
    container_name: basaer-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://basaerschools.com.ng/api}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000" # Bind to localhost, expose via Nginx
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "require('http').get('http://localhost:3000/', r => { if (r.statusCode !== 200) process.exit(1); r.resume(); }).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basaer-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.25"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: basaer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - storage_uploads:/var/www/uploads:ro
      - storage_exports:/var/www/exports:ro
    depends_on:
      - frontend
      - backend
    networks:
      - basaer-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_uploads:
    driver: local
  storage_exports:
    driver: local
  storage_logs:
    driver: local

networks:
  basaer-network:
    driver: bridge