version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: basaeer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basaeer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basaeer_password}
      POSTGRES_DB: ${POSTGRES_DB:-basaeer}
    ports:
      - '127.0.0.1:5432:5432' # Bind only to localhost for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-basaeer} -d ${POSTGRES_DB:-basaeer}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - basaeer-network

  # Redis for Queues
  redis:
    image: redis:7-alpine
    container_name: basaeer-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-strong_redis_password} --appendonly yes
    ports:
      - '127.0.0.1:6379:6379' # Bind only to localhost for security
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-strong_redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - basaeer-network

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: basaeer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-basaeer}:${POSTGRES_PASSWORD:-basaeer_password}@postgres:5432/${POSTGRES_DB:-basaeer}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:-basaeer-salt-2026}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-your-encryption-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-strong_redis_password}
      NODE_ENV: production
      PORT: 3001
      # Limits to prevent memory spikes in Docker
      NODE_OPTIONS: "--max-old-space-size=4096"
    ports:
      - '127.0.0.1:3001:3001' # Bind to localhost, expose via Nginx
    volumes:
      - storage_uploads:/app/public/uploads
      - storage_exports:/app/public/exports
      - storage_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basaeer-network

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://basaerschools.com.ng/api}
    container_name: basaeer-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://basaerschools.com.ng/api}
      NODE_ENV: production
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000' # Bind to localhost, expose via Nginx
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basaeer-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: basaeer-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - storage_uploads:/var/www/uploads:ro
      - storage_exports:/var/www/exports:ro
    depends_on:
      - frontend
      - backend
    networks:
      - basaeer-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_uploads:
    driver: local
  storage_exports:
    driver: local
  storage_logs:
    driver: local

networks:
  basaeer-network:
    driver: bridge
