version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: basaeer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basaeer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basaeer_password}
      POSTGRES_DB: ${POSTGRES_DB:-basaeer}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-basaeer} -d ${POSTGRES_DB:-basaeer}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - basaeer-network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basaeer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-basaeer}:${POSTGRES_PASSWORD:-basaeer_password}@postgres:5432/${POSTGRES_DB:-basaeer}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:-basaeer-salt-2026}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-your-encryption-secret}
      NODE_ENV: production
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basaeer-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: basaeer-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: production
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basaeer-network

volumes:
  postgres_data:
    driver: local

networks:
  basaeer-network:
    driver: bridge
