name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: basaer
          POSTGRES_PASSWORD: basaer_test
          POSTGRES_DB: basaer_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # packages/shared-types' dist/ is gitignored (built fresh on every
      # install) and consumed by both backend and frontend via `file:`
      # deps — build it explicitly rather than relying on `--workspaces`
      # execution order.
      - run: npm run build --workspace=@basaer/shared-types
      - run: npm run build --workspaces
      - run: npm run lint --workspaces
      # Non-blocking: surfaces advisories without failing the pipeline. There is
      # an open backlog of high-severity advisories to remediate via dependency
      # upgrades; re-tighten (remove continue-on-error) once that is done.
      - name: Run audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Run backend tests
        working-directory: backend
        run: npm test -- --coverage
        env:
          DATABASE_URL: postgresql://basaer:basaer_test@localhost:5432/basaer_test
          JWT_SECRET: ci-test-secret-change-in-production
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # frontend's own build is scoped to just this workspace (--workspace=frontend),
      # so it never triggers shared-types' build the way the backend job's
      # --workspaces (plural) run does — build it explicitly first.
      - run: npm run build --workspace=@basaer/shared-types
      - run: npm run build --workspace=frontend
      - run: npm run lint --workspace=frontend
      # The frontend "test" script is Playwright e2e, which requires browsers
      # and a running app+backend. That belongs in a dedicated e2e job (install
      # browsers with `npx playwright install --with-deps`, boot the stack, then
      # run). Kept non-blocking here so build+lint gate the pipeline meaningfully.
      - name: Run frontend e2e (non-blocking)
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm test
        continue-on-error: true
        env:
          CI: true
